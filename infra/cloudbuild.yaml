# Build → Artifact Registry → Cloud Run (PRD §8.2). Socle CI/CD à confirmer (Cloud Build ou GitLab CI).
#   gcloud builds submit --config infra/cloudbuild.yaml --substitutions=_REGION=europe-west1,...
substitutions:
  _REGION: europe-west1
  _REPO: rules-manager
  _API_SERVICE: rules-manager-api
  _FRONT_SERVICE: rules-manager-front
  _API_SA: rules-manager-api@${PROJECT_ID}.iam.gserviceaccount.com
  _SQL_INSTANCE: ${PROJECT_ID}:europe-west1:rules-manager
  _BQ_DATASET: fraud_rules

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/front:${SHORT_SHA}

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}", backend]
  - id: build-front
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/front:${SHORT_SHA}", frontend]
    waitFor: ["-"]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api"]
  - id: push-front
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/front"]

  # Migrations via un job Cloud Run qui réutilise l'image de l'API.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy rules-manager-migrate --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA} \
          --service-account ${_API_SA} --set-cloudsql-instances ${_SQL_INSTANCE} \
          --set-secrets RM_DATABASE_URL=rules-manager-database-url:latest \
          --command alembic --args upgrade,head --execute-now --wait

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - --service-account=${_API_SA}
      # Le contrôle d'accès est réseau (PRD F8, R8) : ingress interne, pas d'IAM Cloud Run
      # entre le front et l'API. Topologie exacte (LB interne, routage /api) à arbitrer.
      - --ingress=internal
      - --allow-unauthenticated
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=RM_DATABASE_URL=rules-manager-database-url:latest
      - --set-env-vars=RM_ENV=prod,RM_BIGQUERY_MODE=real,RM_GCP_PROJECT=${PROJECT_ID},RM_BQ_DATASET=${_BQ_DATASET}

  - id: deploy-front
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(gcloud run services describe ${_API_SERVICE} --region ${_REGION} --format 'value(status.url)')
        gcloud run deploy ${_FRONT_SERVICE} --region ${_REGION} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/front:${SHORT_SHA} \
          --ingress internal-and-cloud-load-balancing \
          --set-env-vars API_UPSTREAM=$${API_URL},API_HOST=$${API_URL#https://}

# Synchronisation des statuts depuis rule_runs (à créer une fois, hors pipeline) :
#   gcloud scheduler jobs create http rules-manager-sync-runs --location ${_REGION} \
#     --schedule "7 * * * *" --http-method POST --uri "<URL de l'API>/internal/sync-runs" \
#     --oidc-service-account-email ${_API_SA}
