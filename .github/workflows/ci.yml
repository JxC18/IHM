name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rules, POSTGRES_PASSWORD: rules, POSTGRES_DB: rules }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rules" --health-interval 3s --health-retries 10
    env:
      RM_DATABASE_URL: postgresql+psycopg://rules:rules@localhost:5432/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      # Les migrations doivent s'appliquer sur PostgreSQL et correspondre aux modèles.
      - run: alembic upgrade head && alembic check

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rules-api ./backend
      - run: docker build -t rules-front ./frontend
